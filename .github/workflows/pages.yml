name: Publish CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the public site
        run: |
          mkdir _site
          cp -R dist/. _site/
          rm -f _site/compare.html _site/classic.html _site/classic-app.js _site/classic-resume.js _site/classic-style.css
          rm -f _site/assets/lou-cinematic.png _site/assets/lou-flow.mp4 _site/assets/lou-pixverse.mp4 _site/assets/lou-streetwear.png _site/assets/lou-vidu.mp4 _site/assets/prepare-brain-source.mjs
          rm -f _site/assets/school-logos/mermoz-header.jpg
          rm -f _site/assets/project-logos/heros-de-la-classe.svg _site/assets/project-logos/heros-de-la-classe.webp _site/assets/project-logos/not-my-fault.svg _site/assets/project-logos/not-my-fault.webp _site/assets/project-logos/okodukai.svg _site/assets/project-logos/okodukai.webp
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
